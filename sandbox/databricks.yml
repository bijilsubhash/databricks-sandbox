# This is a Declarative Automation Bundle definition for sandbox.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sandbox
  uuid: 38c9ef11-c629-40df-91eb-e478cc7fc477

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b1dc4810-5d23.cloud.databricks.com
    variables:
      catalog: sandbox
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-b1dc4810-5d23.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bijil@nimblestax.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bijil@nimblestax.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: sandbox
      schema: prod
    permissions:
      - user_name: bijil@nimblestax.com
        level: CAN_MANAGE
