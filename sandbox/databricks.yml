# This is a Declarative Automation Bundle definition for sandbox.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sandbox
  uuid: 38c9ef11-c629-40df-91eb-e478cc7fc477

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-b1dc4810-5d23.cloud.databricks.com
      profile: sandbox-workspace
    variables:
      catalog: sandbox
      schema: dev_${workspace.current_user.short_name}
